<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="{{site}}/assets/og.png">
<meta property="og:url" content="{{site}}/{{path}}">
<meta property="og:type" content="{{ogtype}}">
<meta property="og:site_name" content="Spliced">
<link rel="canonical" href="{{site}}/{{path}}">
<meta name="color-scheme" content="light dark">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{root}}assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="{{root}}assets/style.css?v={{version}}">
</head>
<body data-root="{{root}}" data-page="{{page}}">
<a class="skip" href="#content">Skip to content</a>

<nav>
  <div class="wrap">
    <a class="brand" href="{{root}}" aria-label="Spliced home">
      <svg viewBox="0 0 500 659" aria-hidden="true"><path fill="currentColor" d="M0 192 L418 0 L418 205 L145 331 L145 449 L0 516 Z M197 385 L500 246 L500 520 L197 659 Z"/></svg>
      Spliced
    </a>
    <div class="nav-right">
      <ul>
        <li><a href="{{root}}research/" data-nav="research">Research</a></li>
        <li><a href="{{root}}tools/joule/" data-nav="tools">Tools</a></li>
        <li><a href="{{root}}lab/" data-nav="lab">Lab</a></li>
        <li><a href="https://github.com/splicedso">GitHub</a></li>
      </ul>
      <button class="theme" id="theme" type="button" aria-label="Dark mode" aria-pressed="false">
        <svg class="moon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M10.5 1.5a6.5 6.5 0 1 0 4 11.6A7 7 0 0 1 10.5 1.5Z"/></svg>
        <svg class="sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2" fill="currentColor"/><path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>
      </button>
    </div>
  </div>
</nav>

<svg id="bus" aria-hidden="true"></svg>

<div id="content">
{{content}}
</div>

<footer>
  <div class="wrap">
    <div class="titleblock mono" data-via>
      <div><svg viewBox="0 0 500 659" aria-hidden="true"><path fill="currentColor" d="M0 192 L418 0 L418 205 L145 331 L145 449 L0 516 Z M197 385 L500 246 L500 520 L197 659 Z"/></svg><span><span class="k">Title</span>{{sheet}}</span></div>
      <div><span class="k">Drawn</span>{{date}}</div>
      <div><span class="k">Sheet</span>{{sheetno}}</div>
      <div><span class="k">Source</span><a href="https://github.com/splicedso">github.com/splicedso</a></div>
    </div>
  </div>
</footer>

<script src="{{root}}assets/site.js?v={{version}}"></script>
{{scripts}}
</body>
</html>
